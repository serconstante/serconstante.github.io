<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ser Constante</title>
<meta name="theme-color" content="#B33A0C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Nunito+Sans:wght@400;600;700&display=swap">
<style>
/* Layout: app de celular en una columna (max 520px) */
:root{
  --bg:#F5F3EF; --card:#FFFFFF; --fg:#1B1714; --muted:#6E655E; --line:#E6E0D8;
  --accent:#B33A0C; --accent-soft:#F7E2D7; --ink:#1B1714; --ok:#2F7D4F; --ok-soft:#DDF0E3;
  --warn:#B7791F; --warn-soft:#FBEBCF; --bad:#B42318; --bad-soft:#F9DCD8; --track:#EADBD2; --fig-bg:#FFFFFF;
  --display:"Poppins",system-ui,sans-serif; --body:"Nunito Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#171412; --card:#221E1B; --fg:#F2ECE6; --muted:#A89E95; --line:#3A332E;
  --accent:#F08A5D; --accent-soft:#3D2519; --ink:#F2ECE6; --ok:#6FCF97; --ok-soft:#1E3326;
  --warn:#F0B95A; --warn-soft:#3A2E17; --bad:#F2877D; --bad-soft:#3D1F1C; --track:#3A2C25; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171412; --card:#221E1B; --fg:#F2ECE6; --muted:#A89E95; --line:#3A332E;
  --accent:#F08A5D; --accent-soft:#3D2519; --ink:#F2ECE6; --ok:#6FCF97; --ok-soft:#1E3326;
  --warn:#F0B95A; --warn-soft:#3A2E17; --bad:#F2877D; --bad-soft:#3D1F1C; --track:#3A2C25; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:1.6rem} h2{font-size:1.2rem} h3{font-size:1rem}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:.85rem}
.demo{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px;align-self:center}
.demo button{border:0;background:none;color:var(--muted);font:600 .85rem var(--display);padding:7px 14px;border-radius:999px;cursor:pointer}
.demo button.on{background:var(--ink);color:var(--bg)}
.tag{display:inline-block;font:600 .7rem var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px}
.btn{border:0;border-radius:12px;padding:14px 18px;font:600 1rem var(--display);cursor:pointer;background:var(--accent);color:#fff;width:100%}
.btn.ghost{background:transparent;color:var(--fg);border:1.5px solid var(--line)}
.btn.small{width:auto;padding:9px 14px;font-size:.85rem}
.btn:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
label{font:600 .85rem var(--display);display:block;margin-bottom:6px}
input,textarea,select{width:100%;font:inherit;color:var(--fg);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:12px}
textarea{min-height:90px;resize:vertical}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{flex:1;border:0;background:var(--card);border:1px solid var(--line);color:var(--muted);font:600 .9rem var(--display);padding:10px;border-radius:12px;cursor:pointer;white-space:nowrap}
.tabs button.on{color:var(--fg);border-color:var(--fg)}
.hero{display:flex;gap:16px;align-items:center}
.ring{flex:none}
.moods{display:flex;gap:8px;justify-content:space-between}
.sets input.hecho{border-color:var(--ok);background:var(--ok-soft)}
.moods button{flex:1;font-size:1.7rem;padding:8px 0;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);cursor:pointer;filter:grayscale(.6);opacity:.75}
.moods button.on{border-color:var(--accent);background:var(--accent-soft);filter:none;opacity:1}
.ex{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.ex:first-of-type{border-top:0;padding-top:0}
.sets{display:flex;gap:8px;flex-wrap:wrap}
.sets input{width:64px;text-align:center;padding:10px 4px;font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:4px;font:600 .75rem var(--display);padding:3px 10px;border-radius:999px}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.bad{background:var(--bad-soft);color:var(--bad)}
.quote{font-family:var(--display);font-weight:600;font-size:1.1rem;border-left:4px solid var(--accent);padding-left:12px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kpi{display:flex;flex-direction:column;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.kpi b{display:block;font:700 1.7rem var(--display);font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column}
.person{display:flex;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;color:inherit;text-align:left;font:inherit;width:100%}
.person:first-child{border-top:0}
.avatar{width:64px;height:64px;border-radius:50%;flex:none;position:relative;cursor:pointer;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font:700 1.3rem var(--display);overflow:hidden}
.avatar img,.av img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.avatar .cam{position:absolute;right:0;bottom:0;background:var(--accent);color:#fff;border-radius:50%;width:24px;height:24px;font-size:.75rem;display:flex;align-items:center;justify-content:center;border:2px solid var(--card)}
.stars{display:flex;gap:6px}.stars button{background:none;border:0;font-size:2rem;cursor:pointer;padding:0;line-height:1;filter:grayscale(1);opacity:.4}.stars button.on{filter:none;opacity:1}
.testi{border:1px solid var(--line);border-radius:16px;padding:16px;background:var(--bg);display:flex;flex-direction:column;gap:8px}
.testi .who{display:flex;gap:10px;align-items:center}
.testi .av{width:48px;height:48px}
.av{width:38px;height:38px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font:700 .9rem var(--display);flex:none}
.bar-chart{display:flex;align-items:flex-end;gap:4px;height:120px;border-bottom:1px solid var(--line)}
.bar-chart div{flex:1;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px}
.axis{display:flex;gap:4px;font-size:.7rem;color:var(--muted);font-variant-numeric:tabular-nums}
.axis span{flex:1;text-align:center}
.compare{display:grid;grid-template-columns:1fr auto auto auto;gap:6px 12px;font-variant-numeric:tabular-nums;align-items:center}
.compare .h{font:600 .75rem var(--display);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.note{font-size:.8rem;color:var(--muted);text-align:center}
.logros{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.logro{border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center;background:var(--bg)}
.logro b{display:block;font-size:1.9rem;line-height:1.1}
.logro span{display:block;font:600 .78rem var(--display);margin-top:4px}
.logro.off{opacity:.38;filter:grayscale(1)}
.nuevo-logro{background:linear-gradient(135deg,#FFE7A3,#FFC83D);color:#1B1714;border-radius:16px;padding:16px;text-align:center;font:700 1rem var(--display)}
.nuevo-logro b{display:block;font-size:2.4rem}
.diploma{border:6px double var(--accent);border-radius:18px;padding:26px 20px;text-align:center;background:var(--card)}
.diploma h1{font-size:1.9rem;margin:6px 0}
.diploma .big{font:800 1.6rem var(--display);color:var(--accent);margin:6px 0}
.diploma .dstats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0;text-align:left}
.diploma .dstats div{border:1px solid var(--line);border-radius:12px;padding:10px}
.diploma .dstats b{display:block;font:800 1.15rem var(--display)}
.done-banner{background:var(--ok-soft);color:var(--ok);border-radius:14px;padding:14px;font:600 1rem var(--display);text-align:center}
.err{color:var(--bad);font-size:.9rem}
.sheet{border:1.5px dashed var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
details.how{border:1px solid var(--line);border-radius:12px;padding:0 12px;background:var(--bg)}
details.how summary{cursor:pointer;font:600 .85rem var(--display);color:var(--accent);padding:10px 0;list-style:none}
details.how summary::-webkit-details-marker{display:none}
details.how[open]{padding-bottom:12px}
.how-body{display:flex;flex-direction:column;gap:10px}
.figs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.figbox{background:var(--fig-bg);border-radius:10px;padding:4px}
.figbox svg{width:100%;height:auto;display:block}
.cap{font-size:.75rem;color:var(--muted);text-align:center;margin-top:2px}
.err-box{background:var(--warn-soft);color:var(--fg);border-radius:10px;padding:8px 10px;font-size:.88rem}
.niv{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.niv button{border:1.5px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;padding:8px 6px;font:600 .72rem var(--display);cursor:pointer;text-align:left;line-height:1.25}
.niv button span{display:block;font:400 .78rem var(--body);color:var(--muted);margin-top:3px}
.niv button.on{border-color:var(--accent);background:var(--accent-soft)}
.optname{font:600 .8rem var(--display);margin-top:4px}
#tbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--ink);color:var(--bg);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#tbar .in{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
#tbar .big{margin:0;font:700 1.6rem var(--display);font-variant-numeric:tabular-nums}
#tbar button{border:0;border-radius:10px;padding:9px 12px;font:600 .82rem var(--display);cursor:pointer;background:var(--bg);color:var(--fg)}
#tbar button.go{background:var(--accent);color:#fff}
#tbar .rest{font:700 1.1rem var(--display);font-variant-numeric:tabular-nums}
.tbtn{border:1.5px solid var(--accent);background:transparent;color:var(--accent);border-radius:10px;padding:7px 12px;font:600 .8rem var(--display);cursor:pointer}
.tbtn.run{background:var(--accent);color:#fff}
.tnum{font-variant-numeric:tabular-nums}
body.has-bar{padding-bottom:150px}
input[type=range]{padding:0;accent-color:var(--accent)}
@media (prefers-reduced-motion:no-preference){.card{animation:in .25s ease-out}@keyframes in{from{transform:translateY(6px)}to{transform:none}}}

.brand{display:flex;gap:12px;align-items:center}
.logo{width:46px;height:46px;border-radius:14px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font:700 1rem var(--display);flex:none}
.link{background:none;border:0;color:var(--muted);font:600 .8rem var(--display);text-decoration:underline;cursor:pointer;align-self:center;padding:8px}
.prog{text-align:left;cursor:pointer;font:inherit;color:inherit;width:100%}
.btn:disabled{opacity:.6}
.print table{width:100%;border-collapse:collapse;margin:8px 0 16px;font-size:.85rem}
.print th,.print td{border:1px solid var(--line);padding:6px;text-align:left}
.print h2{margin-top:16px}
@media print{.noprint{display:none!important}body{background:#fff;color:#000}}


/* ---------- Inglés paso a paso (complemento) ---------- */
.eng{--surface:var(--card);--accent-ink:#fff;--sun:#F2B33D;--sun-ink:#3A2A05;display:flex;flex-direction:column;gap:14px}
.eng button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.eng button:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
.eng .btn.ghost{border:1.5px solid var(--line);font:600 .85rem var(--display);padding:9px 14px;border-radius:12px}
.eng .top{display:flex;align-items:center;gap:12px}
.eng .back{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);flex:none}
.eng .bar{flex:1;height:12px;border-radius:99px;background:var(--line);overflow:hidden}
.eng .bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.eng .hello{display:flex;flex-direction:column;gap:6px}
.eng .hello h1{font-size:1.9rem}
.eng .hello p{color:var(--muted)}
.eng .lvl{display:flex;flex-direction:column;gap:2px;padding:14px 4px 2px}
.eng .lvl b{font-family:var(--display);font-size:1.4rem;color:var(--accent)}
.eng .lvl span{font-size:.9rem;color:var(--muted)}
.eng .count{font-weight:700;color:var(--accent)!important}
.eng .lessons{display:flex;flex-direction:column;gap:10px}
.eng .lesson{display:flex;align-items:center;gap:14px;padding:14px;border-radius:18px;background:var(--surface);border:1px solid var(--line);text-align:left;width:100%}
.eng .lesson .num{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:1.3rem;background:var(--line);color:var(--muted);flex:none}
.eng .lesson.open{border:2px solid var(--accent)}
.eng .lesson.open .num{background:var(--accent);color:var(--accent-ink)}
.eng .lesson.done .num{background:var(--ok);color:var(--accent-ink)}
.eng .lesson .t{font-weight:700}
.eng .lesson .s{font-size:.9rem;color:var(--muted)}
.eng .lesson[disabled]{opacity:.6;cursor:default}
.eng .lesson .end{margin-left:auto;color:var(--muted);flex:none}
.eng .card{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:24px 18px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.eng .es{color:var(--muted)}
.eng .en{font-family:var(--display);font-size:2.3rem;color:var(--fg);line-height:1.1}
.eng .tip{background:var(--sun);color:var(--sun-ink);padding:4px 12px;border-radius:99px;font-size:.95rem;font-weight:700}
.eng .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.eng .pill{display:inline-flex;align-items:center;gap:8px;padding:12px 18px;border-radius:99px;background:var(--bg);border:1px solid var(--line);font-weight:700;min-height:48px}
.eng .mic{width:104px;height:104px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 6px 0 color-mix(in srgb, var(--accent) 60%, #000)}
.eng .mic:active{transform:translateY(3px);box-shadow:0 3px 0 color-mix(in srgb, var(--accent) 60%, #000)}
.eng .mic.on{background:var(--bad);animation:engpulse 1.2s infinite}
@keyframes engpulse{0%{box-shadow:0 0 0 0 color-mix(in srgb, var(--bad) 50%, transparent)}100%{box-shadow:0 0 0 22px transparent}}
@media (prefers-reduced-motion: reduce){.eng .mic.on{animation:none}.eng .bar i{transition:none}}
.eng .use{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:10px 14px;font-size:.95rem;text-align:left;width:100%}
.eng .use b{color:var(--accent)}
.eng .hint{color:var(--muted);font-size:.95rem;min-height:1.4em}
.eng .result{width:100%;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px}
.eng .result.good{background:var(--ok-soft)}
.eng .result.bad{background:var(--bad-soft)}
.eng .words{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;font-family:var(--display);font-size:1.5rem}
.eng .w-ok{color:var(--ok)} .eng .w-bad{color:var(--bad);text-decoration:underline wavy}
.eng .heard{font-size:.85rem;color:var(--muted)}
.eng .next{width:100%;min-height:58px;border-radius:18px;background:var(--accent);color:var(--accent-ink);font-family:var(--display);font-weight:600;font-size:1.3rem}
.eng .next[disabled]{background:var(--line);color:var(--muted);cursor:not-allowed}
.eng .opts{display:flex;flex-direction:column;gap:10px;width:100%}
.eng .opt{min-height:58px;border-radius:16px;background:var(--bg);border:2px solid var(--line);font-weight:700;font-size:1.1rem;padding:10px}
.eng .opt.right{border-color:var(--ok);background:var(--ok-soft)}
.eng .opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.eng .big-play{width:96px;height:96px;border-radius:50%;background:var(--sun);color:var(--sun-ink);display:grid;place-items:center}
.eng .note{font-size:.85rem;color:var(--muted);text-align:center}
.eng .trophy{font-family:var(--display);font-size:4rem;color:var(--sun);line-height:1}
.eng .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.eng .stat{background:var(--bg);border-radius:14px;padding:12px}
.eng .stat b{display:block;font-family:var(--display);font-size:1.7rem;font-variant-numeric:tabular-nums}
.eng .stat span{font-size:.85rem;color:var(--muted)}
.lock{opacity:.85}
</style></head>

function plan(d){
  const w=Math.ceil(d/7), k=(d-1)%7+1, series=[3,4,4,4][w-1];
  if(d===1) return {tipo:"test",titulo:"Test inicial + Tren superior A",ses:"A_sup",series:2};
  if(d===28) return {tipo:"testfin",titulo:"Test final y cierre"};
  if(w===4){
    const m={22:["A_sup",4],23:["A_inf",4],24:["CORE",3],25:["B_sup",3],26:["A_sup",2]};
    if(m[d]) return {tipo:"fuerza",ses:m[d][0],series:m[d][1],titulo:SES[m[d][0]][0]+(d===26?" (descarga suave)":"")};
    return {tipo:"activo",titulo:"Caminata de 30 minutos + 10 de movilidad"};
  }
  const s=[null,"A_sup","A_inf","CORE","B_sup","B_inf"][k];
  if(s) return {tipo:"fuerza",ses:s,series:s==="CORE"?3:series,titulo:SES[s][0]};
  if(k===6) return {tipo:"activo",titulo:"Descanso activo: caminata de "+[30,35,40][w-1]+" minutos"};
  return {tipo:"descanso",titulo:"Descanso total"};
}

function ring(done,today,size=120){
  const r=size/2-10,c=size/2;let o="";
  for(let i=0;i<28;i++){
    const a0=(-90+i*360/28+2.2)*Math.PI/180,a1=(-90+(i+1)*360/28-2.2)*Math.PI/180;
    const col=done.includes(i+1)?"var(--accent)":(i+1===today?"var(--fg)":"var(--track)");
    o+=`<path d="M${(c+r*Math.cos(a0)).toFixed(1)},${(c+r*Math.sin(a0)).toFixed(1)} A${r},${r} 0 0 1 ${(c+r*Math.cos(a1)).toFixed(1)},${(c+r*Math.sin(a1)).toFixed(1)}" stroke="${col}" stroke-width="12" fill="none"/>`;
  }

const ES = {screen:'home', L:0, i:0, passed:false, result:null, listening:false, msg:'', q:0, picked:null, qFirstTry:0, qMiss:false, scores:[]};

/* ---------- voz ---------- */
let voice = null;
function pickVoice(){
  const vs = (window.speechSynthesis && speechSynthesis.getVoices()) || [];
  voice = vs.find(v=>/en[-_]US/i.test(v.lang) && /google|samantha|natural/i.test(v.name)) || vs.find(v=>/en[-_]US/i.test(v.lang)) || vs.find(v=>/^en/i.test(v.lang)) || null;
}
if(window.speechSynthesis){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(text, rate){
  if(!window.speechSynthesis){ ES.msg='Este navegador no puede reproducir audio.'; render(); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text.replace('…',''));
  u.lang='en-US'; u.rate=rate||0.9; if(voice) u.voice=voice;
  speechSynthesis.speak(u);
}

/* ---------- reconocimiento ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const NUM=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen','twenty'];
const TENS={30:'thirty',40:'forty',50:'fifty'};
const WNUM=w=>{const n=NUM.indexOf(w); if(n>=0) return n; for(const k in TENS) if(TENS[k]===w) return +k; return null;};
function norm(t){
  return t.toLowerCase().replace(/[’‘]/g,"'")
    .replace(/\b(1\d|20)(1\d|20)(1\d|20)?\b/g,(m,a,b,c)=>[a,b,c].filter(Boolean).join(' '))
    .replace(/\b\d+\b/g,n=>NUM[+n]||TENS[+n]||n)
    .replace(/can't/g,'cannot').replace(/won't/g,'will not').replace(/n't\b/g,' not')
    .replace(/'m\b/g,' am').replace(/'re\b/g,' are').replace(/'ll\b/g,' will').replace(/'ve\b/g,' have').replace(/'d\b/g,' would')
    .replace(/\b(it|what|where|that|there|he|she|how|who)'s\b/g,'$1 is')
    .replace(/[^a-z ]/g,' ').replace(/\s+/g,' ').trim();
}
function dist(a,b){
  const m=a.length,n=b.length,d=Array.from({length:m+1},(_,i)=>[i]);
  for(let j=1;j<=n;j++)d[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return d[m][n];
}
const EQ = {two:['to','too'], four:['for','fore'], eight:['ate'], one:['won'], ten:['tin'], six:['sex','sixth']};
function grade(target, heard, accept){
  const g1 = gradeWords(target, heard, accept);
  if(!/\d/.test(heard)) return g1;
  // El reconocedor a veces junta los números ("456", "1617"): los comparamos cifra por cifra
  const digits = heard.replace(/\D/g,'');
  const hw = norm(heard.replace(/\d+/g,' ')).split(' ');
  const used = new Set(); let pos = 0;
  const words = norm(target).split(' ').map(w=>{
    const n = WNUM(w);
    if(n!==null){
      const d = String(n);
      if(digits.startsWith(d,pos)){ pos += d.length; return {w,ok:true}; }
      return {w,ok:false};
    }
    const k = hw.findIndex((h,idx)=>!used.has(idx) && (h===w || (EQ[w]||[]).includes(h)));
    if(k>=0){ used.add(k); return {w,ok:true}; }
    return {w,ok:false};
  });
  const pct = Math.round(100*words.filter(x=>x.ok).length/words.length);
  return pct > g1.pct ? {words, pct} : g1;
}
function gradeWords(target, heard, accept){
  if((accept||[]).map(norm).includes(norm(heard))) return {words:norm(target).split(' ').map(w=>({w,ok:true})), pct:100};
  const tw = norm(target).split(' '), hw = norm(heard).split(' ');
  if(norm(target).replace(/ /g,'') === norm(heard).replace(/ /g,'')) return {words:tw.map(w=>({w,ok:true})), pct:100};
  const used = new Set();
  const words = tw.map(w=>{
    const k = hw.findIndex((h,idx)=>!used.has(idx) && (h===w || (EQ[w]||[]).includes(h)));
    if(k>=0){ used.add(k); return {w,ok:true}; }
    return {w,ok:false};
  });
  return {words, pct:Math.round(100*words.filter(x=>x.ok).length/words.length)};
}
function listen(){
  const p = LESSON.phrases[ES.i];
  if(!SR){ ES.msg='El micrófono no funciona en esta vista. Abrí el archivo en Chrome para probar la corrección.'; render(); return; }
  if(ES.listening) return;
  const r = new SR(); r.lang='en-US'; r.interimResults=false; r.maxAlternatives=1;
  ES.listening=true; ES.msg='Te escucho… decilo ahora'; render();
  r.onresult = e=>{
    // Solo la primera interpretación de Chrome: no buscamos la que más nos convenga
    const alt = e.results[0][0];
    const g = grade(p.target||p.en, alt.transcript, p.accept);
    g.heard = alt.transcript;
    g.conf = alt.confidence>0 ? Math.round(alt.confidence*100) : null;
    g.unclear = g.conf!==null && g.conf < MIN_CONF*100;
    g.ok = g.pct>=PASS && !g.unclear;
    ES.result = g;
    if(g.ok){ ES.passed=true; ES.scores[ES.i]=Math.max(ES.scores[ES.i]||0, g.conf ?? 100); }
  };
  r.onerror = e=>{
    ES.msg = e.error==='not-allowed' || e.error==='service-not-allowed'
      ? 'No hay permiso para usar el micrófono. Abrí el archivo en Chrome y aceptá el permiso.'
      : e.error==='no-speech' ? 'No te escuché. Tocá el micrófono y hablá un poco más fuerte.' : 'Algo falló con el micrófono. Probá otra vez.';
  };
  r.onend = ()=>{ ES.listening=false; if(ES.msg.startsWith('Te escucho')) ES.msg=''; render(); };
  try{ r.start(); }catch(e){ ES.listening=false; ES.msg='El micrófono no está disponible en esta vista.'; render(); }
}

/* ---------- pantallas ---------- */
function progress(){
  const total = LESSON.phrases.length + LESSON.quiz.length;
  const done = ES.screen==='quiz' ? LESSON.phrases.length + ES.q : ES.i;
  return Math.round(100*done/total);
}
function home(){
  const open = k => k===0 || !!saved.done[k-1];
  const head = (n,extra) => `<div class="lvl"><b>${LEVELS[n][0]}</b><span>${LEVELS[n][1]}${extra||''}</span></div>`;

  <p class="small muted">Para el micrófono usá Chrome y aceptá el permiso cuando te lo pida.</p></div>
  <div class="lessons">
    ${LESSONS.map((l,k)=>{
      const d=!!saved.done[k], o=open(k);
      const h = (k===0 || LESSONS[k-1].lvl!==l.lvl) ? head(l.lvl) : '';
      return `${h}<button class="lesson ${o?'open':''} ${d?'done':''}" data-eact="start" data-l="${k}" ${o?'':'disabled'}>

    ${UPCOMING.length?head(3,' · próximamente'):''}

      <span class="end">${ICON.lock}</span></button>`).join('')}
  </div>`;
}
function topbar(){

function phrase(){

function quiz(){
  const q = LESSON.quiz[ES.q];

function finish(){
  const avg = Math.round(ES.scores.reduce((a,b)=>a+(b||0),0)/LESSON.phrases.length);
  return `
  <div class="card">

function page(){
  return `<div class="eng">${ES.screen==='home'?home():ES.screen==='phrase'?phrase():ES.screen==='quiz'?quiz():finish()}</div>`;
}
function click(b){
  if(b.disabled) return;
  const a = b.dataset.eact, p = LESSON.phrases[ES.i];
  if(a==='home'){ if(window.speechSynthesis) speechSynthesis.cancel(); ES.screen='home'; }
  if(a==='start'){ ES.L=+b.dataset.l; LESSON=LESSONS[ES.L]; Object.assign(ES,{screen:'phrase',i:0,passed:false,result:null,msg:'',q:0,picked:null,qFirstTry:0,qMiss:false,scores:[]}); }
  if(a==='say') speak(p.say||p.en, 0.9);
  if(a==='slow') speak(p.say||p.en, 0.55);
  if(a==='mic'){ ES.result=null; listen(); return; }
  if(a==='next'){
    if(ES.i<LESSON.phrases.length-1){ ES.i++; ES.passed=false; ES.result=null; ES.msg=''; }
    else { ES.screen='quiz'; ES.q=0; ES.picked=null; ES.qMiss=false; }
  }
  if(a==='qsay') speak(LESSON.quiz[ES.q].say, 0.85);
  if(a==='pick'){
    const k = +b.dataset.k, q = LESSON.quiz[ES.q];
    ES.picked = k;
    if(k===q.ok && !ES.qMiss) ES.qFirstTry++;
    if(k!==q.ok) ES.qMiss = true;
  }
  if(a==='qnext'){
    if(ES.q<LESSON.quiz.length-1){ ES.q++; ES.picked=null; ES.qMiss=false; }
    else { ES.screen='done'; saved.done[ES.L]=true; save(); }
  }
  render();
}
function stop(){ try{ if(window.speechSynthesis) speechSynthesis.cancel(); }catch(e){} }
return {page, click, load, stop, total:LESSONS.length, aprobadas:()=>Object.keys(saved.done).filter(k=>saved.done[k]).length};

async function entrar(){
  const tel=normTel($("#tel").value),pin=$("#pin").value.trim(); S.loginTel=$("#tel").value; S.loginPin=pin;
  if(tel.length!==10){S.msg="Revisá el número: tiene que tener código de área y número, por ejemplo 343 154 123456.";return render()}
  if(!/^\d{4}$/.test(pin)){S.msg="El PIN son 4 números.";return render()}
  S.busy=true;S.msg="";render();
  try{
    const h=await getDoc(doc(db,"habilitados",tel));
    if(!h.exists()){S.busy=false;S.msg="Este número no está inscripto. Escribile a Rogelio.";return render()}
    if(h.data().baja){S.busy=false;S.msg="Este número quedó fuera del reto. Si querés volver, escribile a Rogelio.";return render()}
    try{await signInWithEmailAndPassword(auth,emailDe(tel,h.data().ver),passDe(tel,pin));}
    catch(e){S.busy=false;S.pend={tel,pin,ver:h.data().ver||0};S.vista="registro";S.msg="";return render()}
  }catch(e){S.busy=false;S.msg="No pudimos conectarnos. Revisá tu internet y probá de nuevo.";render()}
}
async function crearCuenta(){
  const P=S.pend; const pin2=$("#pin2").value.trim(),nom=$("#nom").value.trim(),eda=+$("#eda").value.trim();
  if(pin2!==P.pin){S.msg="Los PIN no coinciden. Si ya tenés cuenta, volvé y revisá el PIN.";return render()}
  if(!nom||!eda){S.msg="Completá nombre y edad.";return render()}
  S.busy=true;S.msg="";render();
  try{
    S.creando=true;
    const cred=await createUserWithEmailAndPassword(auth,emailDe(P.tel,P.ver),passDe(P.tel,P.pin));
    await setDoc(doc(db,"usuarios",P.tel),{nombre:nom,edad:eda,tel:P.tel,creado:serverTimestamp()},{merge:true});
    S.creando=false; await cargarParticipante(cred.user);
  }catch(e){
    S.creando=false;S.busy=false;
    S.msg=e.code==="auth/email-already-in-use"?"Ese número ya tiene cuenta y el PIN no coincide. Volvé y probá otra vez, o pedile a Rogelio que te lo resetee.":"No se pudo crear la cuenta. Probá de nuevo.";
    render();
  }
}
async function cargarParticipante(user){
  const tel=user.email.split("-v")[0];
  S.tel=tel; S.busy=false;
  const [p,c,l,hb]=await Promise.all([getDoc(doc(db,"usuarios",tel)),getDoc(doc(db,"contenido",PROG.id)).catch(()=>null),getDocs(collection(db,"usuarios",tel,"dias")),getDoc(doc(db,"habilitados",tel)).catch(()=>null)]);
  S.consultas=[]; try{(await getDocs(collection(db,"usuarios",tel,"consultas"))).forEach(x=>S.consultas.push({id:x.id,...x.data()}));S.consultas.sort((a,b)=>(b.ts||0)-(a.ts||0))}catch(e){}
  S.engOk=!!(hb&&hb.exists()&&hb.data().ingles===true);
  S.perfil=p.exists()?p.data():null;
  if(!S.perfil){ // cuenta recreada tras reseteo pero sin perfil
    S.perfil={nombre:"",edad:""};
  }
  S.cont=c&&c.exists()?c.data():{};
  S.logs={}; l.forEach(x=>{const v=x.data(); if(v.prog===PROG.id) S.logs[v.d]=v});
  ENG.load(S.perfil);
  S.vista="part"; S.prog=null; render();
}

  const t1=logs[1]?.test||{},t28=logs[28]?.test||{};

}

function estado(u){
  if(HOY<1) return ["ok","Inscripción confirmada"];
  const L=Object.values(u.logs); const hoyN=Math.min(HOY,28);
  const lastCal=L.length?Math.max(...L.map(l=>l.diaCalendario||l.d)):0; const gap=hoyN-lastCal;
  const pend=Array.from({length:hoyN},(_,i)=>i+1).filter(x=>!u.logs[x]).length;
  if(gap>=4) return ["bad","Posible abandono"];
  if(gap>=2) return ["warn",gap+" días sin entrar"];
  if(pend>1) return ["ok",`Entrando · ${pend} pendientes`];
  return ["ok",pend===1&&!u.logs[hoyN]?"Le falta hoy":"Al día"];
}

    return `<div class="row" style="padding:8px 0;border-top:1px solid var(--line)"><span class="grow small"><b>${nom(t)}</b><br><span class="muted">${v.ingles?`${n} de ${ENG.total} lecciones`:u?.inglesPide?"Lo pidió":"No habilitado"}</span></span>${v.ingles?`<button class="btn ghost small" data-ingoff="${t}">Quitar</button>`:`<button class="btn small" data-ingon="${t}">Habilitar</button>`}</div>`}).join("")||"<p class='muted'>Todavía no hay números habilitados.</p>"}</div></div>`;
}
function aNum(){
  const H=Object.entries(S.A.hab);
  return `<div class="card"><h2>Habilitar números</h2><p class="small muted">Pegá uno o varios números (uno por línea). Podés poner el nombre después de una coma: <i>343 154 123456, Carla</i>.</p>
  <textarea id="nuevos" placeholder="343 154 123456, Carla&#10;3435 123456, Mariana"></textarea>
  ${S.ok?`<p class="small" style="color:var(--ok)">${S.ok}</p>`:""}${S.msg?`<p class="err">${S.msg}</p>`:""}
  <button class="btn" id="agregar">Habilitar</button></div>
  <div class="card"><h3>${H.length} números habilitados</h3><div class="list">${H.map(([t,v])=>`<div class="person" style="cursor:default"><span class="grow">${verTel(t)}${v.nombre?` · ${esc(v.nombre)}`:""}</span><span class="small muted">${S.A.users[t]?esc(S.A.users[t].nombre):"No entró"}</span></div>`).join("")}</div></div>`;

function aCont(){
  const d=S.diaCont,p=plan(d);
  return `<div class="card"><h2>Contenido de cada día</h2><div><label for="dsel">Día</label><select id="dsel">${Array.from({length:28},(_,i)=>`<option value="${i+1}" ${i+1===d?"selected":""}>Día ${i+1} · ${plan(i+1).titulo}</option>`).join("")}</select></div>
  <p class="small muted">Entrenamiento: ${esc(p.titulo)}</p>
  <div><label for="cpre">Pregunta de coaching</label><textarea id="cpre">${esc(preg(d))}</textarea></div>
  <div><label for="cfra">Frase del día</label><input id="cfra" value="${esc(frase(d))}"></div>
  ${S.ok?`<p class="small" style="color:var(--ok)">${S.ok}</p>`:""}
  <button class="btn" id="gcont">Guardar día ${d}</button></div>`;
}
async function habilitar(){
  const lines=$("#nuevos").value.split("\n").map(x=>x.trim()).filter(Boolean); let n=0,bad=[];
  S.msg="";S.ok="";
  for(const l of lines){const [num,...nom]=l.split(",");const t=normTel(num);if(t.length!==10){bad.push(l);continue}
    await setDoc(doc(db,"habilitados",t),{prog:PROG.id,nombre:nom.join(",").trim(),ver:S.A.hab[t]?.ver||0,baja:false,creado:serverTimestamp()},{merge:true});S.A.hab[t]={...(S.A.hab[t]||{}),nombre:nom.join(",").trim(),ver:S.A.hab[t]?.ver||0};n++}
  S.ok=n?`${n} número${n>1?"s":""} habilitado${n>1?"s":""}.`:""; if(bad.length) S.msg="No entendí estos números: "+bad.map(esc).join(" · "); render();
}
function descargarCSV(){
  const head=["telefono","nombre","edad","dia","sesion","animo_antes","palabra_antes","animo_despues","esfuerzo","duracion_min","reps_total","extra","extra_min","respuesta"];
  const rows=[head];
  Object.entries(S.A.users).forEach(([t,u])=>Object.values(u.logs).sort((a,b)=>a.d-b.d).forEach(l=>{
    const reps=Object.values(l.ej||{}).flat().reduce((a,v)=>a+(+v||0),0);
    rows.push([t,u.nombre,u.edad,l.d,plan(l.d).titulo,l.antes,l.palabraAntes,l.despues,l.esfuerzo,l.dur?(l.dur/60).toFixed(1):"",reps,l.extra?.tipo||"",l.extra?.min||"",l.resp||""])}));
  const csv="﻿"+rows.map(r=>r.map(v=>`"${String(v??"").replace(/"/g,'""')}"`).join(";")).join("\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="ser-constante-28dias.csv";a.click();
}

document.addEventListener("input",e=>{
  const t=e.target,d=S.draft;
  if(t.dataset.ex&&d){(d.ej[t.dataset.ex]=d.ej[t.dataset.ex]||[])[+t.dataset.s]=t.value.replace(/\D/g,"");}
  if(t.dataset.test&&d){(d.test=d.test||{})[t.dataset.test]=t.value.replace(/\D/g,"")}
  if(t.id==="optxt"){S.op=S.op||{};S.op.texto=t.value;S.opOk=false}
  if(!d) return;
  if(t.id==="pal") d.palabraAntes=t.value; if(t.id==="cancion") d.cancion=t.value; if(t.id==="resp") d.resp=t.value; if(t.id==="hecho") d.hecho=t.checked; if(t.dataset&&t.dataset.prep!==undefined){const i=+t.dataset.prep;d.prep=(d.prep||[]).filter(x=>x!==i);if(t.checked)d.prep.push(i)}
  if(t.id==="esf"){d.esfuerzo=+t.value;$("#esfv").textContent=t.value}
  if(t.id==="xt"||t.id==="xm"){const x=$("#xt").value;d.extra=x?{tipo:x,min:+$("#xm").value||0}:null}
});
document.addEventListener("input",()=>setTimeout(saveLocal,0));
document.addEventListener("click",()=>setTimeout(saveLocal,50));

document.addEventListener("change",async e=>{if(e.target.id==="dsel"){S.diaCont=+e.target.value;S.ok="";render()}

document.addEventListener("click",async e=>{
  const b=e.target.closest("button"); if(!b) return;
  if(b.dataset.eact) return ENG.click(b);
  if(b.id==="ping"){S.prog="ingles";return render()}
  if(b.id==="pcuentas"){S.prog="cuentas";scrollTo(0,0);return render()}
  if(b.id==="pideing"){b.disabled=true;try{await setDoc(doc(db,"usuarios",S.tel),{inglesPide:serverTimestamp()},{merge:true});S.perfil.inglesPide=true;}catch(err){b.disabled=false;alert("No se pudo enviar el pedido. Revisá tu internet y probá de nuevo.");}return render()}
  if(b.dataset.ingon||b.dataset.ingoff){const t=b.dataset.ingon||b.dataset.ingoff,on=!!b.dataset.ingon;b.disabled=true;await setDoc(doc(db,"habilitados",t),{ingles:on},{merge:true});S.A.hab[t]={...(S.A.hab[t]||{}),ingles:on};return render()}
  if(b.id==="ingpedidos"){b.disabled=true;const P=ingPedidos();for(const t of P){await setDoc(doc(db,"habilitados",t),{ingles:true},{merge:true});S.A.hab[t]={...(S.A.hab[t]||{}),ingles:true}}return render()}
  if(b.id==="go") return entrar();
  if(b.id==="crear") return crearCuenta();
  if(b.id==="volverlogin"){S.vista="login";S.msg="";return render()}
  if(b.id==="soyadmin"){S.loginRol="admin";S.vista="adminlogin";S.msg="";S.ok="";return render()}
  if(b.id==="soyequipo"){S.loginRol="equipo";S.vista="adminlogin";S.msg="";S.ok="";return render()}
  if(b.id==="cenviar") return enviarConsulta();
  if(b.dataset.cresp) return responderConsulta(b.dataset.cresp);
  if(b.id==="iguardar"){const ti=$("#itit").value.trim(),tx=$("#itxt").value.trim();if(!ti&&!tx)return;b.disabled=true;
    const i={titulo:ti.slice(0,120),texto:tx.slice(0,3000),autor:S.profe?S.profe.nombre||"Profe":"Rogelio",email:auth.currentUser.email,ts:Date.now()};
    try{const r=await addDoc(collection(db,"ideas"),i);S.A.ideas.unshift({id:r.id,...i})}catch(e){alert("No se pudo guardar la idea.")}return render()}
  if(b.dataset.iborrar){if(!confirm("¿Borrar esta idea?"))return;try{await deleteDoc(doc(db,"ideas",b.dataset.iborrar));S.A.ideas=S.A.ideas.filter(x=>x.id!==b.dataset.iborrar)}catch(e){alert("No se pudo borrar.")}return render()}
  if(b.id==="eqadd"){const m=$("#eqmail").value.trim().toLowerCase(),n=$("#eqnom").value.trim();S.msg="";S.ok="";
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(m)){S.msg="Revisá el mail.";return render()}
    await setDoc(doc(db,"equipo",m),{nombre:n||"Profe",rol:"profe",creado:serverTimestamp()});S.A.equipo=S.A.equipo.filter(x=>x.id!==m).concat({id:m,nombre:n||"Profe"});S.ok=`Listo. Pasale el link de la app: entra con "Soy del equipo (profe)", pone ${m} y toca "Recibir link para crear mi contraseña".`;return render()}
  if(b.dataset.eqdel){if(!confirm("¿Quitarle el acceso al panel?"))return;await deleteDoc(doc(db,"equipo",b.dataset.eqdel));S.A.equipo=S.A.equipo.filter(x=>x.id!==b.dataset.eqdel);return render()}
  if(b.id==="aentrar"){const pw=$("#apass").value,em=S.loginRol==="equipo"?(S.aemail=($("#aemail").value||"").trim().toLowerCase()):ADMIN_EMAIL;S.msg="";S.ok="";S.busy=true;render();
    try{await signInWithEmailAndPassword(auth,em,pw)}catch(err){S.busy=false;S.msg="Contraseña incorrecta. Si es la primera vez, tocá \"Recibir link\".";render()}return}
  if(b.id==="acrear"){S.msg="";S.ok="";const eq=S.loginRol==="equipo",em=eq?(S.aemail=($("#aemail").value||"").trim().toLowerCase()):ADMIN_EMAIL;
    if(eq&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){S.msg="Escribí tu mail arriba.";return render()}
    try{const pw="tmp-"+Math.random().toString(36).slice(2)+"-"+Date.now();S.creando=true;
      const c=await createUserWithEmailAndPassword(auth,em,pw);await signOut(auth);S.creando=false;}
    catch(err){S.creando=false}
    try{await sendPasswordResetEmail(auth,em);S.ok=eq?"Listo: revisá tu mail (también Spam). Abrí el link, elegí tu contraseña y volvé acá a entrar.":"Listo: revisá tu Gmail de coach (también Spam). Abrí el link, elegí tu contraseña y volvé acá a entrar.";}
    catch(err){S.msg="No se pudo mandar el mail ("+err.code+").";}
    S.vista="adminlogin";return render()}
  if(b.id==="salir"){T.start=0;clearInterval(T.iv);W.on=false;clearInterval(W.iv);await signOut(auth);return}
  if(b.id==="guardarperfil"){const nom=$("#nom").value.trim(),eda=+$("#eda").value;if(!nom)return;await setDoc(doc(db,"usuarios",S.tel),{nombre:nom,edad:eda,tel:S.tel,creado:serverTimestamp()},{merge:true});S.perfil={nombre:nom,edad:eda};return render()}
  if(b.id==="p28"){S.prog=PROG.id;return render()}
  if(b.id==="aprog"){ENG.stop();S.prog=null;return render()}
  if(b.dataset.tab){S.tab=b.dataset.tab;S.ok="";
    if(S.tab==="con")(S.consultas||[]).filter(c=>c.respuestas?.length&&!c.leida).forEach(c=>{c.leida=true;setDoc(doc(db,"usuarios",S.tel,"consultas",c.id),{leida:true},{merge:true}).catch(()=>{})});
    return render()}
  if(b.parentElement?.classList.contains("moods")&&S.draft){S.draft[b.parentElement.dataset.k]=+b.dataset.v;b.parentElement.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));return}
  if(b.dataset.niv&&S.draft){(S.draft.niv=S.draft.niv||{})[b.dataset.niv]=b.dataset.v;b.parentElement.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));return}
  if(b.id==="wstart") return wStart();
  if(b.id==="tstartall"&&S.draft) return wStart(true,!!b.dataset.resume);
  if(b.id==="treset"&&S.draft){if(!confirm("¿Empezar el entrenamiento de hoy de cero? Se borran las series que anotaste hoy."))return;const d=S.draft;d.ej={};d.nivS={};d.bloque=null;d.dur=0;d.tiempos={};return wStart(true,false)}
  if(b.id==="wnext") return wNext();
  if(b.id==="wpause") return wPause();
  if(b.id==="wfin") return wStop(false);
  if(b.id==="tstart"&&S.draft) return startWorkout();
  if(b.id==="thecha"&&S.draft) return serieHecha();
  if(b.id==="tskip") return nextStep();
  if(b.dataset.nivs){T.nivSel=b.dataset.nivs;return drawBar()}
  if(b.id==="tblqver"||b.id==="tblqver2"){T.blqVer=b.dataset.v;return drawBar()}
  if(b.id==="tblq") return blqStart();
  if(b.id==="tmov") return movStart();
  if(b.id==="tmovnext") return movNext();
  if(b.id==="tswgo"){T.sw=Date.now();return drawBar()}
  if(b.id==="tswstop"){const sec=Math.round((Date.now()-T.sw)/1000);T.sw=0;drawBar();const i=document.getElementById("treps");if(i)i.value=sec;return}
  if(b.id==="tblqskip") return blqNext();
  if(b.id==="tfin"&&S.draft) return finishWorkout();
  if(b.dataset.dia){if(T.start)return;DIA=+b.dataset.dia;S.diaElegido=true;S.draft=null;S.nuevos=null;S.msg="";return render()}
  if(b.id==="editar"){S.nuevos=null;S.draft=JSON.parse(JSON.stringify(S.logs[DIA]));delete S.draft.ts;return render()}
  if(b.id==="guardar") return guardarDia();
  if(b.id==="imprimir"){S.imprimir=true;return render()}

  if(b.id==="cerrarimp"){S.imprimir=false;return render()}

  if(b.id==="volver"){S.verUser=null;return render()}

  if(b.id==="csv") return descargarCSV();

  if(b.dataset.alta){await setDoc(doc(db,"habilitados",b.dataset.alta),{baja:false},{merge:true});return cargarAdmin()}
  if(b.dataset.reset){const t=b.dataset.reset,v=(S.A.hab[t]?.ver||0)+1;await setDoc(doc(db,"habilitados",t),{ver:v},{merge:true});S.A.hab[t]={...(S.A.hab[t]||{}),ver:v};b.textContent="PIN reseteado: la próxima vez elige uno nuevo";b.disabled=true;return}

});

onAuthStateChanged(auth,async user=>{
  if(S.vista!=="adminlogin"){S.msg="";S.ok="";}S.draft=null;S.imprimir=false;S.diploma=false;S.nuevos=null;S.op=null;S.opOk=false;

    if(!user.emailVerified){try{await sendEmailVerification(user)}catch(e){} await signOut(auth);S.vista="adminlogin";S.busy=false;S.msg="";S.ok="Falta un paso: te mandamos un mail para verificar tu Gmail. Abrí el link y volvé a entrar con tu contraseña.";return render()}

    if(eq&&eq.exists()){
      if(!user.emailVerified){try{await sendEmailVerification(user)}catch(e){} await signOut(auth);S.vista="adminlogin";S.loginRol="equipo";S.busy=false;S.msg="";S.ok="Falta un paso: te mandamos un mail para verificar tu correo. Abrí el link y volvé a entrar con tu contraseña.";return render()}
      S.profe={email:user.email.toLowerCase(),...eq.data()};S.adminTab="resumen";return cargarAdmin()}
  }
  if(user.email.endsWith(DOM)) return cargarParticipante(user).catch(()=>{S.vista="login";S.msg="No pudimos cargar tus datos. Probá de nuevo.";render()});
  S.vista="noadmin";render();
});
