<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ser Constante</title>
<meta name="theme-color" content="#B33A0C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Nunito+Sans:wght@400;600;700&display=swap">
<style>
/* Layout: app de celular en una columna (max 520px) */
:root{
  --bg:#F5F3EF; --card:#FFFFFF; --fg:#1B1714; --muted:#6E655E; --line:#E6E0D8;
  --accent:#B33A0C; --accent-soft:#F7E2D7; --ink:#1B1714; --ok:#2F7D4F; --ok-soft:#DDF0E3;
  --warn:#B7791F; --warn-soft:#FBEBCF; --bad:#B42318; --bad-soft:#F9DCD8; --track:#EADBD2; --fig-bg:#FFFFFF;
  --display:"Poppins",system-ui,sans-serif; --body:"Nunito Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#171412; --card:#221E1B; --fg:#F2ECE6; --muted:#A89E95; --line:#3A332E;
  --accent:#F08A5D; --accent-soft:#3D2519; --ink:#F2ECE6; --ok:#6FCF97; --ok-soft:#1E3326;
  --warn:#F0B95A; --warn-soft:#3A2E17; --bad:#F2877D; --bad-soft:#3D1F1C; --track:#3A2C25; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171412; --card:#221E1B; --fg:#F2ECE6; --muted:#A89E95; --line:#3A332E;
  --accent:#F08A5D; --accent-soft:#3D2519; --ink:#F2ECE6; --ok:#6FCF97; --ok-soft:#1E3326;
  --warn:#F0B95A; --warn-soft:#3A2E17; --bad:#F2877D; --bad-soft:#3D1F1C; --track:#3A2C25; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:1.6rem} h2{font-size:1.2rem} h3{font-size:1rem}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:.85rem}
.demo{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px;align-self:center}
.demo button{border:0;background:none;color:var(--muted);font:600 .85rem var(--display);padding:7px 14px;border-radius:999px;cursor:pointer}
.demo button.on{background:var(--ink);color:var(--bg)}
.tag{display:inline-block;font:600 .7rem var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px}
.btn{border:0;border-radius:12px;padding:14px 18px;font:600 1rem var(--display);cursor:pointer;background:var(--accent);color:#fff;width:100%}
.btn.ghost{background:transparent;color:var(--fg);border:1.5px solid var(--line)}
.btn.small{width:auto;padding:9px 14px;font-size:.85rem}
.btn:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
label{font:600 .85rem var(--display);display:block;margin-bottom:6px}
input,textarea,select{width:100%;font:inherit;color:var(--fg);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:12px}
textarea{min-height:90px;resize:vertical}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.tabs{display:flex;gap:6px;overflow-x:auto}
.tabs button{flex:1;border:0;background:var(--card);border:1px solid var(--line);color:var(--muted);font:600 .9rem var(--display);padding:10px;border-radius:12px;cursor:pointer;white-space:nowrap}
.tabs button.on{color:var(--fg);border-color:var(--fg)}
.hero{display:flex;gap:16px;align-items:center}
.ring{flex:none}
.moods{display:flex;gap:8px;justify-content:space-between}
.moods button{flex:1;font-size:1.7rem;padding:8px 0;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);cursor:pointer;filter:grayscale(.6);opacity:.75}
.moods button.on{border-color:var(--accent);background:var(--accent-soft);filter:none;opacity:1}
.ex{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.ex:first-of-type{border-top:0;padding-top:0}
.sets{display:flex;gap:8px;flex-wrap:wrap}
.sets input{width:64px;text-align:center;padding:10px 4px;font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:4px;font:600 .75rem var(--display);padding:3px 10px;border-radius:999px}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.bad{background:var(--bad-soft);color:var(--bad)}
.quote{font-family:var(--display);font-weight:600;font-size:1.1rem;border-left:4px solid var(--accent);padding-left:12px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.kpi b{display:block;font:700 1.7rem var(--display);font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column}
.person{display:flex;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;color:inherit;text-align:left;font:inherit;width:100%}
.person:first-child{border-top:0}
.av{width:38px;height:38px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font:700 .9rem var(--display);flex:none}
.bar-chart{display:flex;align-items:flex-end;gap:4px;height:120px;border-bottom:1px solid var(--line)}
.bar-chart div{flex:1;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px}
.axis{display:flex;gap:4px;font-size:.7rem;color:var(--muted);font-variant-numeric:tabular-nums}
.axis span{flex:1;text-align:center}
.compare{display:grid;grid-template-columns:1fr auto auto auto;gap:6px 12px;font-variant-numeric:tabular-nums;align-items:center}
.compare .h{font:600 .75rem var(--display);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.note{font-size:.8rem;color:var(--muted);text-align:center}
.done-banner{background:var(--ok-soft);color:var(--ok);border-radius:14px;padding:14px;font:600 1rem var(--display);text-align:center}
.err{color:var(--bad);font-size:.9rem}
.sheet{border:1.5px dashed var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
details.how{border:1px solid var(--line);border-radius:12px;padding:0 12px;background:var(--bg)}
details.how summary{cursor:pointer;font:600 .85rem var(--display);color:var(--accent);padding:10px 0;list-style:none}
details.how summary::-webkit-details-marker{display:none}
details.how[open]{padding-bottom:12px}
.how-body{display:flex;flex-direction:column;gap:10px}
.figs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.figbox{background:var(--fig-bg);border-radius:10px;padding:4px}
.figbox svg{width:100%;height:auto;display:block}
.cap{font-size:.75rem;color:var(--muted);text-align:center;margin-top:2px}
.err-box{background:var(--warn-soft);color:var(--fg);border-radius:10px;padding:8px 10px;font-size:.88rem}
.niv{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.niv button{border:1.5px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;padding:8px 6px;font:600 .72rem var(--display);cursor:pointer;text-align:left;line-height:1.25}
.niv button span{display:block;font:400 .78rem var(--body);color:var(--muted);margin-top:3px}
.niv button.on{border-color:var(--accent);background:var(--accent-soft)}
.optname{font:600 .8rem var(--display);margin-top:4px}
#tbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--ink);color:var(--bg);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#tbar .in{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
#tbar .big{margin:0;font:700 1.6rem var(--display);font-variant-numeric:tabular-nums}
#tbar button{border:0;border-radius:10px;padding:9px 12px;font:600 .82rem var(--display);cursor:pointer;background:var(--bg);color:var(--fg)}
#tbar button.go{background:var(--accent);color:#fff}
#tbar .rest{font:700 1.1rem var(--display);font-variant-numeric:tabular-nums}
.tbtn{border:1.5px solid var(--accent);background:transparent;color:var(--accent);border-radius:10px;padding:7px 12px;font:600 .8rem var(--display);cursor:pointer}
.tbtn.run{background:var(--accent);color:#fff}
.tnum{font-variant-numeric:tabular-nums}
body.has-bar{padding-bottom:150px}
input[type=range]{padding:0;accent-color:var(--accent)}
@media (prefers-reduced-motion:no-preference){.card{animation:in .25s ease-out}@keyframes in{from{transform:translateY(6px)}to{transform:none}}}

.brand{display:flex;gap:12px;align-items:center}
.logo{width:46px;height:46px;border-radius:14px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font:700 1rem var(--display);flex:none}
.link{background:none;border:0;color:var(--muted);font:600 .8rem var(--display);text-decoration:underline;cursor:pointer;align-self:center;padding:8px}
.prog{text-align:left;cursor:pointer;font:inherit;color:inherit;width:100%}
.btn:disabled{opacity:.6}
.print table{width:100%;border-collapse:collapse;margin:8px 0 16px;font-size:.85rem}
.print th,.print td{border:1px solid var(--line);padding:6px;text-align:left}
.print h2{margin-top:16px}
@media print{.noprint{display:none!important}body{background:#fff;color:#000}}

</style></head>

function plan(d){
  const w=Math.ceil(d/7), k=(d-1)%7+1, series=[3,4,4,4][w-1];
  if(d===1) return {tipo:"test",titulo:"Test inicial + Tren superior A",ses:"A_sup",series:2};
  if(d===28) return {tipo:"testfin",titulo:"Test final y cierre"};
  if(w===4){
    const m={22:["A_sup",4],23:["A_inf",4],24:["CORE",3],25:["B_sup",3],26:["A_sup",2]};
    if(m[d]) return {tipo:"fuerza",ses:m[d][0],series:m[d][1],titulo:SES[m[d][0]][0]+(d===26?" (descarga suave)":"")};
    return {tipo:"activo",titulo:"Caminata de 30 minutos + 10 de movilidad"};
  }
  const s=[null,"A_sup","A_inf","CORE","B_sup","B_inf"][k];
  if(s) return {tipo:"fuerza",ses:s,series:s==="CORE"?3:series,titulo:SES[s][0]};
  if(k===6) return {tipo:"activo",titulo:"Descanso activo: caminata de "+[30,35,40][w-1]+" minutos"};
  return {tipo:"descanso",titulo:"Descanso total"};
}

  if(!d) return;
  if(t.id==="pal") d.palabraAntes=t.value; if(t.id==="resp") d.resp=t.value; if(t.id==="hecho") d.hecho=t.checked;
  if(t.id==="esf"){d.esfuerzo=+t.value;$("#esfv").textContent=t.value}
  if(t.id==="xt"||t.id==="xm"){const x=$("#xt").value;d.extra=x?{tipo:x,min:+$("#xm").value||0}:null}
});
document.addEventListener("change",e=>{if(e.target.id==="dsel"){S.diaCont=+e.target.value;S.ok="";render()}});
document.addEventListener("click",async e=>{
  const b=e.target.closest("button"); if(!b) return;
  if(b.id==="go") return entrar();
  if(b.id==="crear") return crearCuenta();
  if(b.id==="volverlogin"){S.vista="login";S.msg="";return render()}
  if(b.id==="soyadmin"){try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(err){S.msg="No se pudo entrar con Google.";render()}return}
  if(b.id==="salir"){T.start=0;clearInterval(T.iv);await signOut(auth);return}
  if(b.id==="guardarperfil"){const nom=$("#nom").value.trim(),eda=+$("#eda").value;if(!nom)return;await setDoc(doc(db,"usuarios",S.tel),{nombre:nom,edad:eda,tel:S.tel,creado:serverTimestamp()},{merge:true});S.perfil={nombre:nom,edad:eda};return render()}
  if(b.id==="p28"){S.prog=PROG.id;return render()}
  if(b.id==="aprog"){S.prog=null;return render()}
  if(b.dataset.tab){S.tab=b.dataset.tab;return render()}
  if(b.parentElement?.classList.contains("moods")&&S.draft){S.draft[b.parentElement.dataset.k]=+b.dataset.v;b.parentElement.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));return}
  if(b.dataset.niv&&S.draft){(S.draft.niv=S.draft.niv||{})[b.dataset.niv]=b.dataset.v;b.parentElement.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));return}
  if(b.id==="tstart"&&S.draft) return startWorkout();
  if(b.id==="thecha"&&S.draft) return serieHecha();
  if(b.id==="tskip") return nextStep();
  if(b.id==="tfin"&&S.draft) return finishWorkout();
  if(b.id==="editar"){S.draft=JSON.parse(JSON.stringify(S.logs[HOY]));delete S.draft.ts;return render()}
  if(b.id==="guardar") return guardarDia();
  if(b.id==="imprimir"){S.imprimir=true;return render()}
  if(b.id==="cerrarimp"){S.imprimir=false;return render()}
  if(b.dataset.atab){S.adminTab=b.dataset.atab;S.verUser=null;S.msg="";S.ok="";return render()}
  if(b.dataset.u){S.verUser=b.dataset.u;return render()}
  if(b.id==="volver"){S.verUser=null;return render()}
  if(b.id==="recargar") return cargarAdmin();
  if(b.id==="csv") return descargarCSV();
  if(b.dataset.reset){const t=b.dataset.reset,v=(S.A.hab[t]?.ver||0)+1;await setDoc(doc(db,"habilitados",t),{ver:v},{merge:true});S.A.hab[t]={...(S.A.hab[t]||{}),ver:v};b.textContent="PIN reseteado: la próxima vez elige uno nuevo";b.disabled=true;return}
  if(b.id==="agregar") return habilitar();
  if(b.id==="gcont"){const c=S.cont||{};const P=[...(c.preg||PREG)],F=[...(c.frases||FRASES)];P[S.diaCont-1]=$("#cpre").value;F[S.diaCont-1]=$("#cfra").value;await setDoc(doc(db,"contenido",PROG.id),{preg:P,frases:F});S.cont={preg:P,frases:F};S.ok="Guardado el día "+S.diaCont;return render()}
});

onAuthStateChanged(auth,async user=>{
  S.msg="";S.ok="";S.draft=null;S.imprimir=false;
  if(!user){S.vista="login";S.tel=null;S.A=null;S.busy=false;return render()}
  if(user.email===ADMIN_EMAIL){S.admin=true;return cargarAdmin()}
  if(S.creando) return;
  if(user.email.endsWith(DOM)) return cargarParticipante(user).catch(()=>{S.vista="login";S.msg="No pudimos cargar tus datos. Probá de nuevo.";render()});
  S.vista="noadmin";render();
});
render();

</script></body></html>
